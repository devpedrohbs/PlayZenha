name: playzenha

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: playzenha
      POSTGRES_USER: playzenha
      POSTGRES_PASSWORD: playzenha
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playzenha -d playzenha"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - playzenha-postgres-data:/var/lib/postgresql/data

volumes:
  playzenha-postgres-data:
