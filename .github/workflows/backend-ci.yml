name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://playzenha:playzenha@localhost:5432/playzenha?schema=public
      CORS_ORIGINS: http://localhost:5173
      SWAGGER_ENABLED: 'false'
      LOG_LEVEL: error
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: playzenha
          POSTGRES_USER: playzenha
          POSTGRES_PASSWORD: playzenha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playzenha -d playzenha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: HTTP tests
        run: npm run test:e2e

      - name: Database integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
